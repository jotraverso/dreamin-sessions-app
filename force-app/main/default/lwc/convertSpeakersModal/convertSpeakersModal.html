<template>
  <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleClose}>
          <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
          <span class="slds-assistive-text">Close</span>
        </button>
        <h2 class="slds-modal__title slds-hyphenate">Convert Speakers to Contacts</h2>
        <p class="slds-m-top_x-small">Review and edit speaker information before creating contacts</p>
      </header>
      <div class="slds-modal__content slds-p-around_medium">
        <template if:true={loading}>
          <div class="slds-text-align_center">
            <lightning-spinner alternative-text="Loading speakers..."></lightning-spinner>
          </div>
        </template>

        <template if:false={loading}>
          <template if:true={hasSpeakers}>
            <template for:each={speakers} for:item="speaker" for:index="index">
              <div key={speaker.email} class="slds-box slds-m-bottom_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                  <h3 class="slds-text-heading_small">{speaker.speakerTypeLabel}</h3>
                  <template if:true={speaker.contactId}>
                    <lightning-badge label="Contact Created" class="slds-theme_success"></lightning-badge>
                  </template>
                </div>

                <div class="slds-grid slds-wrap slds-gutters_small">
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                      label="First Name"
                      value={speaker.firstName}
                      data-index={index}
                      data-field="firstName"
                      onchange={handleFieldChange}
                      required
                    ></lightning-input>
                  </div>
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                      label="Last Name"
                      value={speaker.lastName}
                      data-index={index}
                      data-field="lastName"
                      onchange={handleFieldChange}
                      required
                    ></lightning-input>
                  </div>
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                      type="email"
                      label="Email"
                      value={speaker.email}
                      data-index={index}
                      data-field="email"
                      onchange={handleFieldChange}
                      required
                    ></lightning-input>
                  </div>
                  <div class="slds-col slds-size_1-of-2">
                    <lightning-input
                      label="Job Title"
                      value={speaker.jobTitle}
                      data-index={index}
                      data-field="jobTitle"
                      onchange={handleFieldChange}
                    ></lightning-input>
                  </div>
                  <div class="slds-col slds-size_1-of-1">
                    <lightning-textarea
                      label="Bio"
                      value={speaker.bio}
                      data-index={index}
                      data-field="bio"
                      onchange={handleFieldChange}
                      rows="3"
                    ></lightning-textarea>
                  </div>
                  <template if:true={showIndividualButtons}>
                    <div class="slds-col slds-size_1-of-1 slds-text-align_right">
                      <lightning-button
                        variant="brand"
                        label={speaker.buttonLabel}
                        data-index={index}
                        onclick={handleConvertSpeaker}
                        disabled={speaker.isConvertDisabled}
                      ></lightning-button>
                    </div>
                  </template>
                  <template if:true={speaker.error}>
                    <div class="slds-col slds-size_1-of-1">
                      <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>{speaker.error}</h2>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </template>

          <template if:true={allContactsLinked}>
            <div class="slds-text-align_center slds-m-top_medium">
              <lightning-button
                variant="brand"
                label="Update contacts info"
                onclick={handleUpdateAll}
                disabled={isUpdateAllDisabled}
              ></lightning-button>
            </div>
          </template>

          <template if:false={hasSpeakers}>
            <div class="slds-text-align_center slds-p-around_large">
              <p class="slds-text-body_regular slds-text-color_weak">No speaker information available for this session</p>
            </div>
          </template>
        </template>
      </div>
      <footer class="slds-modal__footer">
        <lightning-button variant="neutral" label="Close" onclick={handleClose}></lightning-button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
</template>
