<template>
  <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
      <header class="slds-modal__header">
        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleClose}>
          <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
          <span class="slds-assistive-text">Close</span>
        </button>
        <h2 class="slds-modal__title slds-hyphenate">{session.title}</h2>
      </header>
      <div class="slds-modal__content slds-p-around_medium">
        <template if:true={session}>
          <!-- Session Info Grid -->
          <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">
                  <p class="slds-truncate">Session Name</p>
                </dt>
                <dd class="slds-dl_horizontal__detail slds-tile__meta">
                  <p class="slds-truncate">{session.name}</p>
                </dd>
              </dl>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">
                  <p class="slds-truncate">Language</p>
                </dt>
                <dd class="slds-dl_horizontal__detail slds-tile__meta">
                  <p class="slds-truncate">{session.language}</p>
                </dd>
              </dl>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">
                  <p class="slds-truncate">Level</p>
                </dt>
                <dd class="slds-dl_horizontal__detail slds-tile__meta">
                  <p class="slds-truncate">{session.level}</p>
                </dd>
              </dl>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-m-bottom_small">
              <dl class="slds-dl_horizontal">
                <dt class="slds-dl_horizontal__label">
                  <p class="slds-truncate">Duration</p>
                </dt>
                <dd class="slds-dl_horizontal__detail slds-tile__meta">
                  <p class="slds-truncate">{durationLabel}</p>
                </dd>
              </dl>
            </div>
          </div>

          <!-- Scores -->
          <div class="slds-m-top_medium slds-m-bottom_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">Evaluation Scores</h3>
            <div class="slds-grid slds-wrap slds-gutters_small">
              <div class="slds-col slds-size_1-of-4">
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_small">
                  <div class="slds-text-title">Final Score</div>
                  <div class="slds-text-heading_large">{finalScoreDisplay}</div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-4">
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_small">
                  <div class="slds-text-title">Clarity</div>
                  <div class="slds-text-heading_medium">{clarityDisplay}</div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-4">
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_small">
                  <div class="slds-text-title">Content</div>
                  <div class="slds-text-heading_medium">{contentDisplay}</div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-4">
                <div class="slds-box slds-theme_shade slds-text-align_center slds-p-around_small">
                  <div class="slds-text-title">Engagement</div>
                  <div class="slds-text-heading_medium">{engagementDisplay}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Abstract -->
          <div class="slds-m-bottom_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">Abstract</h3>
            <div class="slds-text-body_regular">{session.abstractText}</div>
          </div>

          <!-- Categories -->
          <div class="slds-m-bottom_medium">
            <h3 class="slds-text-heading_small slds-m-bottom_small">Categories</h3>
            <div class="slds-text-body_regular">{categoriesDisplay}</div>
          </div>

          <!-- Speakers -->
          <div>
            <h3 class="slds-text-heading_small slds-m-bottom_small">Speakers</h3>
            <div class="slds-grid slds-wrap slds-gutters_small">
              <template if:true={session.primarySpeakerName}>
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                  <article class="slds-box">
                    <h4 class="slds-text-heading_small slds-m-bottom_x-small">Primary Speaker</h4>
                    <dl class="slds-dl_horizontal">
                      <dt class="slds-dl_horizontal__label">Name</dt>
                      <dd class="slds-dl_horizontal__detail">{session.primarySpeakerName}</dd>
                    </dl>
                    <template if:true={session.primarySpeakerEmail}>
                      <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label">Email</dt>
                        <dd class="slds-dl_horizontal__detail">{session.primarySpeakerEmail}</dd>
                      </dl>
                    </template>
                  </article>
                </div>
              </template>
              <template if:true={session.coSpeakerName}>
                <div class="slds-col slds-size_1-of-1">
                  <article class="slds-box">
                    <h4 class="slds-text-heading_small slds-m-bottom_x-small">Co-Speaker</h4>
                    <dl class="slds-dl_horizontal">
                      <dt class="slds-dl_horizontal__label">Name</dt>
                      <dd class="slds-dl_horizontal__detail">{session.coSpeakerName}</dd>
                    </dl>
                    <template if:true={session.coSpeakerEmail}>
                      <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label">Email</dt>
                        <dd class="slds-dl_horizontal__detail">{session.coSpeakerEmail}</dd>
                      </dl>
                    </template>
                  </article>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      <footer class="slds-modal__footer">
        <lightning-button variant="neutral" label="Close" onclick={handleClose}></lightning-button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
</template>
