<template>
  <template if:true={hasEvaluationProgress}>
    <div class={bannerClass}>
      <lightning-icon icon-name={bannerIcon} alternative-text="Evaluation Status" size="small" class="slds-m-right_small"></lightning-icon>
      <span class="slds-text-heading_small">{summaryMessage}</span>
      <lightning-button
        variant="base"
        label={toggleLabel}
        onclick={handleToggle}
        class="slds-m-left_medium"
        icon-name={toggleIcon}
        icon-position="right"
      ></lightning-button>
    </div>

    <!-- Evaluation Details Table -->
    <template if:true={showDetails}>
      <div class="slds-box slds-m-top_x-small slds-theme_shade">
        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-table_fixed-layout">
          <thead>
            <tr class="slds-line-height_reset">
              <th scope="col" style="width: 25%">
                <div class="slds-truncate">Evaluator</div>
              </th>
              <th scope="col" style="width: 30%">
                <div class="slds-truncate">Progress</div>
              </th>
              <th scope="col" style="width: 12%">
                <div class="slds-truncate">Submitted</div>
              </th>
              <th scope="col" style="width: 13%">
                <div class="slds-truncate">Status</div>
              </th>
              <th scope="col" style="width: 20%">
                <div class="slds-truncate">Last Updated</div>
              </th>
            </tr>
          </thead>
          <tbody>
            <template for:each={formattedProgress} for:item="run">
              <tr key={run.runId}>
                <td>
                  <div class="slds-truncate" title={run.evaluatorName}>{run.evaluatorName}</div>
                </td>
                <td>
                  <div class="slds-grid slds-grid_vertical-align-center slds-nowrap">
                    <div class="slds-grow">
                      <lightning-progress-bar value={run.percentComplete} variant={run.progressVariant} size="medium"></lightning-progress-bar>
                    </div>
                    <span class="slds-m-left_small slds-shrink-none" style="min-width: 45px; text-align: right">{run.formattedPercent}</span>
                  </div>
                </td>
                <td>
                  <div class="slds-truncate slds-text-align_center">{run.submittedCount} / {run.totalEvaluations}</div>
                </td>
                <td>
                  <span class={run.statusBadgeClass}>
                    <template if:true={run.isComplete}>Complete</template>
                    <template if:false={run.isComplete}>In Progress</template>
                  </span>
                </td>
                <td>
                  <div class="slds-truncate" title={run.formattedDate}>{run.formattedDate}</div>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </template>
  </template>
</template>
