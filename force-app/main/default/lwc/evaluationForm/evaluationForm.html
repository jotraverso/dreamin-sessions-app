<template>
  <div class="evaluation-form">
    <!-- Main Layout: Session Info and Evaluation Controls -->
    <div class="form-layout">
      <!-- Session Info Display -->
      <div class="session-info-section">
        <template if:true={sessionInfo}>
          <div class="slds-box slds-theme_shade">
            <h2 class="slds-text-heading_medium slds-m-bottom_small">{sessionInfo.title}</h2>
            <p class="slds-text-body_regular slds-m-bottom_small session-abstract">{sessionInfo.abstract}</p>
            <div class="slds-grid slds-gutters slds-wrap slds-text-body_small">
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"><strong>Level:</strong> {sessionInfo.level}</div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"><strong>Category:</strong> {sessionInfo.category}</div>
              <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3"><strong>Duration:</strong> {sessionInfo.duration} min</div>
            </div>
          </div>
        </template>
      </div>

      <!-- Scoring Section -->
      <div class="scoring-section">
        <div class="slds-form">
          <div class="slds-form-element slds-m-bottom_medium">
            <div class="slds-form-element__label">
              <abbr class="slds-required" title="required">* </abbr>Clarity: {clarity} / 20
              <template if:true={clarityHelpText}>
                <lightning-helptext content={clarityHelpText} icon-name="utility:info"></lightning-helptext>
              </template>
            </div>
            <lightning-slider name="clarity" value={clarity} min="0" max="20" step="1" onchange={handleInput}> </lightning-slider>
          </div>

          <div class="slds-form-element slds-m-bottom_medium">
            <div class="slds-form-element__label">
              <abbr class="slds-required" title="required">* </abbr>Diversity: {diversity} / 10
              <template if:true={diversityHelpText}>
                <lightning-helptext content={diversityHelpText} icon-name="utility:info"></lightning-helptext>
              </template>
            </div>
            <lightning-slider name="diversity" value={diversity} min="0" max="10" step="1" onchange={handleInput}> </lightning-slider>
          </div>

          <div class="slds-form-element slds-m-bottom_medium">
            <div class="slds-form-element__label">
              <abbr class="slds-required" title="required">* </abbr>Engagement: {engagement} / 20
              <template if:true={engagementHelpText}>
                <lightning-helptext content={engagementHelpText} icon-name="utility:info"></lightning-helptext>
              </template>
            </div>
            <lightning-slider name="engagement" value={engagement} min="0" max="20" step="1" onchange={handleInput}> </lightning-slider>
          </div>

          <lightning-textarea class="slds-m-top_small" name="comments" label="Comments" value={comments} onchange={handleInput}> </lightning-textarea>
        </div>
      </div>
    </div>

    <!-- Error Messages -->
    <template if:true={error}>
      <div class="slds-m-top_small">
        <p class="slds-text-color_error">{error}</p>
      </div>
    </template>
  </div>
</template>
