<template>
  <div class="evaluation-form">
    <!-- Scoring Section -->
    <div class="slds-form slds-m-bottom_medium">
      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label">
          <abbr class="slds-required" title="required">* </abbr>Clarity:
          {clarity} / 20
        </label>
        <lightning-slider
          name="clarity"
          value={clarity}
          min="0"
          max="20"
          step="1"
          onchange={handleInput}
        >
        </lightning-slider>
      </div>

      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label">
          <abbr class="slds-required" title="required">* </abbr>Diversity:
          {diversity} / 10
        </label>
        <lightning-slider
          name="diversity"
          value={diversity}
          min="0"
          max="10"
          step="1"
          onchange={handleInput}
        >
        </lightning-slider>
      </div>

      <div class="slds-form-element slds-m-bottom_medium">
        <label class="slds-form-element__label">
          <abbr class="slds-required" title="required">* </abbr>Engagement:
          {engagement} / 20
        </label>
        <lightning-slider
          name="engagement"
          value={engagement}
          min="0"
          max="20"
          step="1"
          onchange={handleInput}
        >
        </lightning-slider>
      </div>

      <lightning-textarea
        class="slds-m-top_small"
        name="comments"
        label="Comments"
        value={comments}
        onchange={handleInput}
      >
      </lightning-textarea>
    </div>

    <!-- Session Info Display -->
    <template if:true={sessionInfo}>
      <div class="slds-box slds-theme_shade slds-m-bottom_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_small">
          {sessionInfo.title}
        </h2>
        <p class="slds-text-body_regular slds-m-bottom_small">
          {sessionInfo.abstract}
        </p>
        <div class="slds-grid slds-gutters slds-text-body_small">
          <div class="slds-col">
            <strong>Level:</strong> {sessionInfo.level}
          </div>
          <div class="slds-col">
            <strong>Category:</strong> {sessionInfo.category}
          </div>
          <div class="slds-col">
            <strong>Duration:</strong> {sessionInfo.duration} min
          </div>
        </div>
      </div>
    </template>

    <!-- Error Messages -->
    <template if:true={error}>
      <div class="slds-m-top_small">
        <p class="slds-text-color_error">{error}</p>
      </div>
    </template>
  </div>
</template>
